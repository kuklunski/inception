services:
  nginx:
    container_name: nginx
    image: nginx:inception
    build: ./requirements/nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    restart: unless-stopped
    networks:
      - inception-network
    depends_on:
    - wordpress

  mariadb:
    container_name: mariadb
    image: mariadb:inception
    build: ./requirements/mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - inception-network
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password

  wordpress:
    container_name: wordpress
    image: wordpress:inception
    depends_on:
      - mariadb
    build: ./requirements/wordpress
    volumes:
      - wordpress_data:/var/www/html
    restart: unless-stopped
    networks:
      - inception-network
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
  
secrets:
  wp_admin_password:
    file: ./secrets/wp_admin_password.txt
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt

networks:
  inception-network:
    driver: bridge

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      #matnsach tbdel hado
      device: /home/yasser/data/wordpress
      o: bind

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      #matnsach tbdel hado
      device: /home/yasser/data/mysql
      o: bind